[package]
name = "embedded-database-kv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "embedded-database KV 访问接口"

[features]
default = []
# std 路径：启用 embedded-database-core 的 std（Db 等导出），提供完整 KvDb 实现。
# no_std 路径（default）：仅导出 Placeholder，保证裸机目标可编译（C1）。
std = ["embedded-database-core/std"]

[dependencies]
embedded-database-core = { workspace = true, default-features = false }

[dev-dependencies]
# 测试在 host 上编译，需要 embedded-database-core/std 导出的 Db/InMemoryDevice。
# resolver v2：构建测试时 dev-dependency 特性与普通依赖统一。
embedded-database-core = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
