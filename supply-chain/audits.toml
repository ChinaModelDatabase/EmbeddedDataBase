[[audits.proc-macro2]]
who = "embedded-database maintainers"
criteria = "safe-to-deploy"
version = "1.0.107"
notes = """本地实质性审计 2026-10-18（Spec 2 §3.3 八项清单）：build.rs 存在且已全文审阅（约 340 行）——环境变量访问限于 RUSTC（rustc_minor_version 调用 `rustc --version` 探测编译器版本，本地进程）、RUSTC_STAGE、RUSTC_BOOTSTRAP、RUSTC_WRAPPER、RUSTC_WORKSPACE_WRAPPER、TARGET、CARGO_ENCODED_RUSTFLAGS；进程调用仅 Command::new(rustc) 两类：--version 探测与 do_compile_probe 编译 src/probe/*.rs 特性探测文件到 OUT_DIR/probe，随后 fs::remove_dir_all 清理；文件系统写仅限 OUT_DIR 内（create_dir/remove_dir_all），不读写仓库或用户任意路径；无网络访问（无 TcpStream/http 客户端）。src 内取证命令 `rg -n 'std::net|TcpStream|std::process|Command::new|env!|std::env|fs::' vendor/proc-macro2/src` 仅命中 probe/proc_macro_span.rs:55 的 option_env!("RUSTC_BOOTSTRAP")（与 build.rs 探测逻辑配套的编译期常量）与 extra.rs:62 文档注释示例，无运行时副作用。unsafe 取证命令 `rg -n 'unsafe' vendor/proc-macro2/src` 命中 8 处子串 / 6 个实质行：lib.rs:91 为 deny(unsafe_op_in_unsafe_fn) 属性、fallback.rs:107 为 ManuallyDrop + ptr::read 的 NoDrop 移出（有 make_owned 配对）、fallback.rs:1002 与 wrapper.rs:802 的 unsafe fn from_str_unchecked（wrapper.rs:806 为其唯一 unsafe 调用点，入参为内部生成的字面量 repr）、lib.rs:1421-1422 为公开 unsafe API Literal::from_str_unchecked（信任边界在调用方）；crate 根 deny(unsafe_op_in_unsafe_fn)。no_std（lib.rs:86 #![no_std]，proc-macro/span-locations 为可选 feature）。MIT OR Apache-2.0，LICENSE-APACHE 与 LICENSE-MIT 均存在。Cargo.lock 与 vendor 版本均为 1.0.107。深度声明：build.rs 全文审阅；src 为结构性取证 + 关键路径抽样，6029 行未逐行。"""

[[audits.syn]]
who = "embedded-database maintainers"
criteria = "safe-to-deploy"
version = "2.0.119"
notes = "本地实质性审计 2026-10-18（Spec 2 §3.3 八项清单）：无 build.rs（proc-macro 特性经 proc-macro2/quote 实现）；55 个 src 文件共 50120 行。环境/文件系统/进程/网络取证命令 `rg -n 'std::net|TcpStream|std::process|Command::new|env!|std::env|fs::' vendor/syn/src` 仅命中 file.rs:19-38 与 lib.rs:978 的文档注释示例（展示调用方如何用 std::fs::read_to_string 读文件再 parse_file），syn 自身运行时不访问文件系统、网络、进程或环境变量。unsafe 取证：`rg -o 'unsafe' vendor/syn/src | wc -l` = 205 个子串命中，排除 tests/ 后按文件分布（rg -c '\bunsafe\b'）为 buffer.rs 30、item.rs 18、expr.rs 6、token.rs 4、stmt.rs 4、attr.rs 4、ty.rs 3、thread.rs 2、parse.rs 2、scan_expr.rs/ident.rs/discouraged.rs 各 1、gen/token.css 1；实质归类——item.rs/expr.rs/stmt.rs/attr.rs/ty.rs/ident.rs/scan_expr.rs/gen 的命中全部是 Rust `unsafe` 关键字作为 AST 节点（Token![unsafe] 解析与文档描述），非 syn 代码执行 unsafe；真实 unsafe 集中于 token 流缓冲与生命周期桥接：buffer.rs 30 处（TokenStream 游标指针算术，模块头注释声明承载本 crate 绝大部分 unsafe 并逐处论证）、thread.rs:12/18 为 ThreadBound 的 unsafe impl Sync/Send（注释论证 Send 需 Copy 约束）、token.rs:314/320 与 discouraged.rs:199、parse.rs:383/394 为 Cursor/WithSpan 的生命周期 transmute（parse.rs 附近有 proof 参数做借用期校验）。no_std（lib.rs:251 #![no_std]）。MIT OR Apache-2.0，LICENSE-APACHE 与 LICENSE-MIT 均存在。Cargo.lock 与 vendor 版本均为 2.0.119。深度声明：50120 行未逐行审阅；为结构性取证 + unsafe 归类与关键路径抽样。"

