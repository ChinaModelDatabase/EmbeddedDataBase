[[audits.zerocopy-derive]]
who = "embedded-database maintainers"
criteria = "safe-to-deploy"
version = "0.8.59"
notes = "本地实质性审计 2026-10-18（Spec 2 §3.3 八项清单）：proc-macro=true，无 build.rs；unsafe 取证（计数方法：`rg -o 'unsafe' vendor/zerocopy-derive/src | rg -v 'tests?/' | wc -l`，即排除 tests/ 与 output_tests/ 后对 `unsafe` 做子串计数）= 10 处，其准确归属为：2 处是 proc-macro 源码中的真实 unsafe——try_from_bytes.rs:336 的 unsafe 块（紧邻上方 SAFETY 注释论证 soundness）与 try_from_bytes.rs:398 的 unsafe fn gen_trivial_is_safe_unchecked；8 处是 quote! 模板字符串与 clippy 属性名中的字面 unsafe（project.rs:195；known_layout.rs:79、162、231；util.rs:871、977；lib.rs:24-25 的 clippy 属性声明），随宏展开输出到调用方或仅为属性名，非 proc-macro 实现自身执行的 unsafe；其余命中（全量口径 809 处子串 / 44 文件）在 output_tests/expected/ 的宏展开快照与测试代码中。环境/文件系统访问：取证命令 `rg 'std::env|env!|std::fs|std::net|TcpStream|std::process|Command' vendor/zerocopy-derive/src` 排除 output_tests/ 后零命中；仅有的 3 处命中均在 output_tests/mod.rs（:84 读环境变量 ZEROCOPY_BLESS、:85 env! 宏、:88 std::fs::write 落盘 bless 期望输出），该模块由 lib.rs:54-55 的 #[cfg(test)] 门控，仅在测试构建下参与编译，非测试代码无网络、进程、环境变量、文件系统访问。直接运行时依赖仅 proc-macro2/quote/syn（vendor Cargo.toml 声明 1.0.1 / 1.0.40 / 2.0.46[features=full]，本仓库 Cargo.lock 解析为 1.0.107 / 1.0.47 / 2.0.119，syn 2.0.119 作为普通依赖正常解析）；另有 dev-dependencies（dissimilar 1.0.9、prettyplease 0.2.17、rustversion 1.0、static_assertions 1.1、syn 2.0.46[visit]）声明于 vendor 中 zerocopy-derive 自身的 Cargo.toml，仅供其测试使用，不改变本仓库 Cargo.lock 解析图（lock 中无 dissimilar/prettyplease/rustversion/static_assertions 条目）；BSD-2-Clause OR Apache-2.0 OR MIT；Cargo.lock 与 vendor 版本均 0.8.59。深度声明：宏展开代码未逐行审阅，为结构性取证 + 关键路径抽样。"
