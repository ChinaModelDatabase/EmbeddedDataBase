
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.embedded-database-bench]
criteria = "safe-to-deploy"

[policy.embedded-database-cli]
criteria = "safe-to-deploy"

[policy.embedded-database-core]
criteria = "safe-to-deploy"

[policy.embedded-database-embed]
criteria = "safe-to-deploy"

[policy.embedded-database-kv]
criteria = "safe-to-deploy"

[policy.embedded-database-os]
criteria = "safe-to-deploy"

[policy.embedded-database-sql]
criteria = "safe-to-deploy"

[[exemptions.autocfg]]
version = "1.5.1"
criteria = "safe-to-run"
notes = "dev-only（proptest 及其传递依赖，不进入交付物）；未做人工审计，保留豁免以放行构建与测试。复审日期 2027-04-30（cargo-vet 0.10.2 不支持豁免 expires 字段——该字段会被下一次重写静默剥离，故以本 notes 约定）。"

